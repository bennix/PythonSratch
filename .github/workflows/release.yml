name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "${{ matrix.platform }}" = "win" ]; then
            .venv/Scripts/python -m pip install --upgrade pip
            .venv/Scripts/python -m pip install pandas matplotlib
          else
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install pandas matplotlib
            sudo apt-get update
            sudo apt-get install -y rpm
            find .venv -type l | while read -r link; do
              target=$(readlink -f "$link") || continue
              rm "$link"
              cp -a "$target" "$link"
            done
          fi
      - run: npm ci
      - name: Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never
      - name: Debian package
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb --publish never
      - name: RPM package
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: DEBUG=electron-builder npx electron-builder --linux rpm --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/PythonScratch-*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "macOS、Windows、Linux 安装包。macOS 的 dmg 若未出现在本页，会由本机签名后再补上。"
